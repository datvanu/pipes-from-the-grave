# Render blueprint for a single Free web service (UI + API).
# Do not apply this blueprint or connect a Render account without Kilian's approval.
services:
  - type: web
    name: pipes-from-the-grave
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @pipes/web
    startCommand: ./node_modules/.bin/tsx apps/server/src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Rule-based demo stays the default in the UI. "byok" additionally lets
      # visitors paste their own key (browser-only, forwarded per request to the
      # allowlisted OpenAI endpoint, never stored). No key is set here.
      - key: GHOST_MODE
        value: byok
      - key: TRUST_PROXY
        value: "1"
      # After the Render account exists, set this to the public HTTPS origin
      # (for example https://YOUR-SERVICE.onrender.com) so export links are
      # absolute. Until then the host serves relative /p/:id links and does
      # not trust the Host or Forwarded headers.
      # - key: PUBLIC_BASE_URL
      #   value: https://YOUR-SERVICE.onrender.com
